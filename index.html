<!DOCTYPE html>
<html lang="id-ID">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kover E-Book Bahasa Indonesia</title>
    <!-- Font dari Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            /* Latar belakang paduan warna cerah ceria khas anak-anak + gambar background baru kamu */
            background: linear-gradient(135deg, rgba(224, 242, 254, 0.6), rgba(220, 252, 231, 0.6)), 
                        url('background.png') center center / cover no-repeat fixed;
            font-family: 'Quicksand', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Kotak tempat tulisan - Efek Glassmorphism Modern */
        .kotak-tulisan {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: clamp(2.5rem, 6vw, 4rem) clamp(1.5rem, 5vw, 3rem) clamp(2rem, 5vw, 3.5rem);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 
                        inset 0 0 0 2px rgba(255, 255, 255, 0.6);
            text-align: center;
            width: 100%;
            max-width: 620px;
            position: relative; /* Dasar patokan posisi tombol suara di dalam */
            animation: munculKeAtas 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes munculKeAtas {
            0% { opacity: 0; transform: translateY(50px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Judul Utama */
        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 700;
            color: #0284c7;
            margin-top: 25px; /* Jarak aman agar terpisah dari tombol suara */
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.8);
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        /* Sub Judul */
        h2 {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(1.3rem, 4.5vw, 1.8rem);
            font-weight: 600;
            color: #16a34a;
            margin-bottom: 2rem;
        }

        /* Container Info Badge */
        .info-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 2.5rem;
            align-items: center;
        }

        /* Kartu info / badge */
        .badge-materi {
            background: #f0fdf4;
            color: #166534;
            padding: 10px 18px;
            border-radius: 15px;
            font-weight: 600;
            font-size: clamp(0.95rem, 3vw, 1.1rem);
            border: 1px solid #bbf7d0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            width: 100%;
        }

        .badge-kurikulum {
            background: #f0f9ff;
            color: #0369a1;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: clamp(0.9rem, 3vw, 1rem);
            border: 1px solid #bae6fd;
            display: inline-block;
        }

        /* Info Pembuat */
        .identitas-pengembang {
            margin-top: 15px;
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 600;
            line-height: 1.5;
        }
        
        .identitas-pengembang span {
            color: #334155;
            font-weight: 700;
        }

        /* Tombol Mulai */
        .tombol {
            margin-top: 1rem;
            padding: 1rem 3rem;
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-weight: 700;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #38bdf8, #22c55e);
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3), 
                        0 4px 0px #16a34a; 
            transition: all 0.2s ease;
            position: relative;
            top: 0;
        }

        .tombol:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(34, 197, 94, 0.4), 
                        0 6px 0px #16a34a;
            background: linear-gradient(135deg, #0ea5e9, #15803d);
        }

        .tombol:active {
            top: 4px;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.2), 
                        0 0px 0px #16a34a;
        }

        /* === TOMBOL PENGATUR SUARA (Di Dalam Kotak - Diperbaiki Jaraknya) === */
        .tombol-suara {
            position: absolute;
            top: 25px;      /* Diturunkan agar lepas dari lengkungan sudut */
            right: 25px;    /* Digeser ke kiri agar masuk ke area putih */
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 3px solid white;
            background: #f97316;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(249, 115, 22, 0.3);
            transition: transform 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;    /* Memastikan tombol selalu di lapisan teratas */
        }

        .tombol-suara:hover {
            transform: scale(1.08);
            background: #ea580c;
        }
    </style>
</head>
<body>

    <div class="kotak-tulisan">
        <!-- Tombol suara sekarang manis di dalam pojok kanan atas kotak -->
        <button class="tombol-suara" id="tombolSuara" onclick="aturSuara()">🔊</button>

        <h1>E-BOOK INTERAKTIF</h1>
        <h2>Pembelajaran Bahasa Indonesia</h2>
        
        <div class="info-container">
            <div class="badge-materi">
                📚 <strong>Materi:</strong> Teks Deskripsi, Narasi, Informatif
            </div>
            <div>
                <span class="badge-kurikulum">Kelas 5 SD</span>
                <span class="badge-kurikulum" style="background:#fff7ed; color:#c2410c; border-color:#ffedd5;">CP BSKAP 2025 • Fase C</span>
            </div>
        </div>

        <button class="tombol" onclick="mainkanSuaraTombol()">Mulai Belajar 🚀</button>

        <div class="identitas-pengembang">
            <p>Pengembang: <span> Nanda Oktaviendra </span></p>
            <p>Tahun: <span>2026</span></p>
        </div>
    </div>

    <!-- === ELEMEN BACKSOUND === -->
    <audio id="backsound" loop autoplay muted>
        <source src="Background Music.mp3" type="audio/mpeg">
        Browser tidak mendukung pemutaran suara.
    </audio>

    <!-- === ELEMEN SUARA TOMBOL === -->
    <audio id="suaraTombol" preload="auto">
        <source src="klik.mp3" type="audio/mpeg">
        Browser tidak mendukung pemutaran suara.
    </audio>

    <script>
        const backsound = document.getElementById('backsound');
        const tombolSuara = document.getElementById('tombolSuara');
        let suaraMenyala = true;

        backsound.volume = 0.20;

        window.addEventListener('load', function() {
            backsound.muted = false;
            backsound.play().catch(function(error) {
                console.log("Autoplay diblokir browser. Suara menyala setelah interaksi pertama.");
            });
        });

        function aturSuara() {
            if (suaraMenyala) {
                backsound.pause();
                tombolSuara.textContent = '🔇';
            } else {
                backsound.play().catch(err => console.log(err));
                tombolSuara.textContent = '🔊';
            }
            suaraMenyala = !suaraMenyala;
        }

        function mainkanSuaraTombol() {
            const suara = document.getElementById('suaraTombol');
            suara.currentTime = 0;
            suara.play().catch(err => console.log("Gagal memutar audio klik"));

            setTimeout(function() {
                window.location.href = "identitas.html";
            }, 350);
        }
    </script>
</body>
</html>
